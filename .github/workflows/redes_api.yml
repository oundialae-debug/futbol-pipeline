name: Redes - descargas de la API (nombres y Champions)

# Usuario 06/10/2026: "descarga de la API todo lo que necesites" (cuota aún amplia; en ~1 semana pasa a 100/día).
# Solo workflow_dispatch: cada lanzamiento es una descarga pedida. Ver scripts/redes_api.py.
on:
  workflow_dispatch:
    inputs:
      modo: {description: 'nombres | ucl | popularidad (Google Trends, sin API)', required: true, default: 'ucl'}
      tope_llamadas: {description: 'Tope de llamadas', required: false, default: '400'}
      temporada: {description: 'Temporada de la Champions (2026 = 2026/27)', required: false, default: '2026'}

concurrency: {group: redes-api, cancel-in-progress: false}

jobs:
  bajar:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests pandas pytrends
      - name: Descargar
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          TOPE_LLAMADAS: ${{ inputs.tope_llamadas }}
          TEMPORADA: ${{ inputs.temporada }}
        run: python scripts/redes_api.py ${{ inputs.modo }}
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add data/redes
          git diff --cached --quiet && exit 0
          git commit -m "redes api: ${{ inputs.modo }} $(date -u +%F)"
          # -X theirs: si dos descargas tocan el mismo CSV, gana la de este run (la otra se puede repetir; antes se perdía todo)
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
