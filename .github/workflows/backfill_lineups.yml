name: Backfill lineups

# Alineaciones titulares crudas (formación + IDs de jugadores) para calcular
# un índice de rotación en rasgos.py. Esquema comprobado con sondeo_lineups.py
# y sondeo_matches.py (23/09) contra partidos viejos. Reanudable.
on:
  workflow_dispatch:
    inputs:
      tope_llamadas:
        description: 'Maximo de llamadas a la API en esta pasada'
        required: false
        default: '3000'

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests pandas

      - name: Traer lineups
        run: python scripts/backfill_lineups.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          TOPE_LLAMADAS: ${{ inputs.tope_llamadas || '3000' }}

      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historico_lineups.csv || true
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "Lineups: $(wc -l < data/historico_lineups.csv) filas ($(date -u +%Y-%m-%dT%H:%M))"
          git pull --rebase origin main
          git push
