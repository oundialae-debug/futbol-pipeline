name: Descargar tenis (tennis-data)

# Sin API de Highlightly (no tiene tenis). tennis-data.co.uk está bloqueada
# desde el contenedor de Claude; por eso se baja aquí. Aprobado por el
# usuario el 30/09/2026. Se lanza a mano (workflow_dispatch) y guarda en la
# rama que lo lanza. Sackmann y TennisMyLife se bajan desde el contenedor con
# modelos/tenis/scripts/descargar_tml_sackmann.py.
on:
  workflow_dispatch:

jobs:
  descargar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas openpyxl xlrd
      - name: Descargar
        run: python modelos/tenis/scripts/descargar_tenis.py
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tenis || true
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "Tenis: descarga tennis-data ($(date -u +%Y-%m-%dT%H:%M))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
