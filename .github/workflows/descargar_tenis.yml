name: Descargar tenis (tennis-data + Sackmann)

# Sin API de Highlightly (no tiene tenis). Fuentes gratuitas sin clave,
# bloqueadas desde el contenedor de Claude. Aprobado por el usuario el
# 30/09/2026. Se lanza al empujar este fichero o el script a la rama de
# trabajo, o a mano; guarda los datos en la MISMA rama que lo lanzó.
on:
  workflow_dispatch:
  push:
    branches: [ccr-3c3cfe57-etcioo]
    paths:
      - .github/workflows/descargar_tenis.yml
      - modelos/tenis/scripts/descargar_tenis.py

jobs:
  descargar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas openpyxl xlrd
      - name: Sondeo Sackmann
        continue-on-error: true
        # El 30/09 el clon falló con "could not read Username" (repo inexistente
        # o privado). Se deja constancia de lo que responde GitHub y se buscan
        # copias, sin suponer nada.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/tenis
          f=data/tenis/sondeo_sackmann.md
          echo "# Sondeo Sackmann ($(date -u +%Y-%m-%dT%H:%M) UTC)" > $f
          for r in JeffSackmann/tennis_atp JeffSackmann/tennis_wta; do
            echo "## $r" >> $f
            curl -sS -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/$r \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print('respuesta:', {k: d.get(k) for k in ('message','full_name','private','archived','pushed_at','html_url')})" >> $f
          done
          echo "## Cuenta JeffSackmann (repos públicos)" >> $f
          curl -sS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/users/JeffSackmann/repos?per_page=100" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d if isinstance(d,dict) else '\n'.join(f\"- {x['full_name']} (push {x['pushed_at']})\" for x in d))" >> $f
          for q in "tennis_atp" "tennis_wta"; do
            echo "## Búsqueda de repos: $q" >> $f
            curl -sS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/search/repositories?q=$q+in:name&sort=stars&per_page=15" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print('\n'.join(f\"- {x['full_name']} (push {x['pushed_at']}, {x['size']} KB, fork={x['fork']}, estrellas {x['stargazers_count']})\" for x in d.get('items',[])) or d)" >> $f
          done
          cat $f
      - name: Clonar Sackmann
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/JeffSackmann/tennis_atp /tmp/sackmann/tennis_atp || true
          git clone --depth 1 https://github.com/JeffSackmann/tennis_wta /tmp/sackmann/tennis_wta || true
      - name: Descargar
        run: python modelos/tenis/scripts/descargar_tenis.py
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tenis || true
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "Tenis: descarga tennis-data + Sackmann ($(date -u +%Y-%m-%dT%H:%M))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
