name: Backfill historico completo 2025-26

on:
  workflow_dispatch:   # solo se lanza a mano, no está programado -- es una tarea puntual

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests pandas

      - name: Ejecutar el backfill (puede tardar varios minutos)
        run: python scripts/backfill_historico_completo.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}

      - name: Guardar los datos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f data/historico_completo_2025_26.csv ]; then
            echo "No se generó el archivo -- revisa el log del paso anterior."
            exit 1
          fi
          git add data/historico_completo_2025_26.csv data/eventos_tarjetas_jugadores_2025_26.csv
          git diff --staged --quiet && echo "Sin cambios" && exit 0
          git commit -m "Backfill histórico 2025-26"
          git pull --rebase origin main
          git push
