name: Monitor en directo

# Solo lectura. Muestrea el reloj de los partidos en juego varias veces
# seguidas para distinguir si la API va en vivo de verdad o va con retraso.
#
# Sin cron: la respuesta ya está, y fue que el reloj SÍ avanza. Lo que
# fallaba era este script, que ordenaba por minuto descendente y seguía
# partidos muertos clavados en el 90. Se queda a mano.
on:
  workflow_dispatch:
    inputs:
      muestras:
        description: 'Número de muestras del reloj'
        required: false
        default: '5'
      espera:
        description: 'Segundos entre muestras'
        required: false
        default: '75'
  # Sin cron: era un diagnóstico temporal y ya contestó lo suyo. Se
  # queda lanzable a mano, pero deja de gastar llamadas, que ahora
  # hacen falta para acumular descansos cada quince minutos.

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests
      - run: python scripts/monitor_directo.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          MUESTRAS: ${{ inputs.muestras || '5' }}
          ESPERA: ${{ inputs.espera || '75' }}
