name: Monitor en directo

# Solo lectura. Muestrea el reloj de los partidos en juego varias veces
# seguidas para distinguir si la API va en vivo de verdad o va con retraso.
#
# Los cron caen a mitad de cada franja de LaLiga (los partidos empiezan a
# 12:00, 14:15, 16:30 y 19:00 UTC), que es donde la cobertura de la API
# está garantizada. Es la prueba limpia: si ahí el reloj tampoco avanza,
# el dato en directo no sirve y no es cuestión de qué ligas cubre.
#
# TEMPORAL: quitar el bloque 'schedule' en cuanto haya respuesta.
on:
  workflow_dispatch:
    inputs:
      muestras:
        description: 'Número de muestras del reloj'
        required: false
        default: '5'
      espera:
        description: 'Segundos entre muestras'
        required: false
        default: '75'
  schedule:
    - cron: '35 12 * * 6,0'   # mitad de la 1ª parte, franja 12:00 UTC
    - cron: '50 14 * * 6,0'   # mitad de la 1ª parte, franja 14:15 UTC
    - cron: '5 17 * * 6,0'    # mitad de la 1ª parte, franja 16:30 UTC
    - cron: '35 19 * * 6,0'   # mitad de la 1ª parte, franja 19:00 UTC

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/monitor_directo.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          MUESTRAS: ${{ inputs.muestras || '5' }}
          ESPERA: ${{ inputs.espera || '75' }}
