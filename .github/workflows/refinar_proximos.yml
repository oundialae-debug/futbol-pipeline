name: Refinar partidos proximos

on:
  schedule:
    - cron: '*/1500 * * * *'   # cada 15 minutos
  workflow_dispatch:

jobs:
  refinar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests pandas scipy numpy

      - name: Refinar partidos proximos
        run: python scripts/refinar_proximos.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}

      - name: Guardar cambios si los hay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/registro_predicciones.csv data/partidos_refinados.md; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "Sin partidos que refinar en esta pasada"
            exit 0
          fi
          git commit -m "Refinado automático ($(date +%Y-%m-%dT%H:%M))"
          git pull --rebase origin main
          git push
