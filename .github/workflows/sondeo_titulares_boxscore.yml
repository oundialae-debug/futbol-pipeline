name: Sondeo titulares en box-score (2023/24)

# ¿/box-score de 2023/24 marca isSubstitute? /lineups no tiene nada antes de
# abril de 2024. ~16 llamadas. Escribe sondeo_titulares_boxscore.md.
on:
  workflow_dispatch:

jobs:
  sondeo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests pandas
      - name: Sondear
        run: python scripts/sondeo_titulares_boxscore.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
      - name: Guardar informe
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sondeo_titulares_boxscore.md || true
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "Sondeo titulares box-score: $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin main
          git push
