name: Ambos marcan - registro en papel diario

# Petición del usuario (29/09/2026): el registro en papel de ambos marcan se
# llena solo. Las 6 ligas por ID: durante la Nations League solo juega la
# Segunda; cuando vuelva la liga, entran las demás sin tocar nada.
#  - 08:07 UTC: resultados de ayer (backfill_historico, temporada 2026), evalúa
#    el registro, busca los partidos de hoy (1 llamada por liga) y hace un
#    primer pronóstico de todos (3 llamadas por partido).
#  - cada media hora de 10:07 a 21:37 UTC: SOLO si un partido empieza en los
#    próximos 35 minutos, lo repite con el once y las cuotas del momento. Si
#    no hay ninguno, no gasta API.
on:
  schedule:
    - cron: '7 8 * * *'
    - cron: '7,37 10-21 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'manana (todo el día) o previa (solo los que empiezan pronto)'
        required: false
        default: 'manana'

concurrency:
  group: ambos-marcan-diario
  cancel-in-progress: false

jobs:
  registro:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MANANA: ${{ github.event.schedule == '7 8 * * *' || (github.event_name == 'workflow_dispatch' && inputs.modo != 'previa') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Resultados de ayer
        if: env.MANANA == 'true'
        run: python scripts/backfill_historico.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          TEMPORADAS: '2026'
          TOPE_LLAMADAS: '80'

      - name: Partidos de hoy (datos y cuotas)
        run: |
          if [ "$MANANA" = "true" ]; then
            python scripts/ambos_marcan_hoy.py descargar
          else
            VENTANA_MIN=35 python scripts/ambos_marcan_hoy.py descargar
          fi
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}

      - name: Pronóstico y registro
        run: |
          if [ "$(tail -n +2 data/ambos_hoy/partidos.csv | wc -l)" -gt 0 ] || [ "$MANANA" = "true" ]; then
            python scripts/ambos_marcan_hoy.py pronosticar
          else
            echo "Ningún partido empieza pronto: nada que hacer."
          fi

      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historico_partidos.csv data/ambos_hoy data/ambos_marcan/registro_papel.csv modelos/ambos_marcan/registro_papel.md || true
          if git diff --staged --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Ambos marcan diario: $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
