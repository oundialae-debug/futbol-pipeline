name: Pronósticos API-Tennis

# 4 peticiones a API-Tennis (partidos y cuotas del día, marcadores y cuotas en directo) con
# el secreto API_TENNIS_KEY. Guarda la tabla en modelos/tenis/pronosticos/ de la rama que lo lanza.
on:
  workflow_dispatch:
  push:
    branches: [ccr-3c3cfe57-etcioo]
    paths:
      - .github/workflows/pronosticos_api_tennis.yml
      - modelos/tenis/scripts/pronosticos_api.py

jobs:
  pronosticos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas
      - name: Pronosticar
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        run: python -u modelos/tenis/scripts/pronosticos_api.py
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add modelos/tenis/pronosticos data/tenis/api_tennis || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -q -m "Pronósticos API-Tennis ($(date -u +%Y-%m-%dT%H:%M))"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"
