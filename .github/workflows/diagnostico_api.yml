name: Diagnóstico de la API

# Ya contestó lo suyo: la API SÍ sirve eventos parciales en directo y SÍ
# hay cuotas en vivo (oddsType=live). Por eso se queda solo a mano.
#
# Se conserva porque sigue siendo la forma rápida de mirar qué devuelve un
# endpoint cuando algo deja de cuadrar.
on:
  workflow_dispatch:
  # Sin cron: era un diagnóstico temporal y ya contestó lo suyo. Se
  # queda lanzable a mano, pero deja de gastar llamadas, que ahora
  # hacen falta para acumular descansos cada quince minutos.

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # el script es de solo lectura: no commitea nada
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar el diagnóstico
        run: python scripts/diagnostico_api.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
