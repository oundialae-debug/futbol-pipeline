name: Diagnóstico de la API

# A mano, y además en unas ventanas fijas de fin de semana para poder
# pillar un partido EN JUEGO: es la única forma de contestar si la API
# sirve eventos parciales en directo y si hay cuotas en vivo.
#
# Las horas apuntan al descanso aproximado de cada franja de LaLiga
# (los partidos empiezan a 12:00, 14:15, 16:30 y 19:00 UTC), que es
# justo el momento que interesa: al descanso ya se ha visto el 35% de
# las tarjetas y queda por repartirse el 65%.
#
# TEMPORAL: cuando una pasada conteste las preguntas del directo, borrar
# el bloque 'schedule' entero y dejar solo workflow_dispatch.
on:
  workflow_dispatch:
  schedule:
    - cron: '50 12 * * 6,0'   # descanso de la franja de las 12:00 UTC
    - cron: '5 15 * * 6,0'    # descanso de la franja de las 14:15 UTC
    - cron: '20 17 * * 6,0'   # descanso de la franja de las 16:30 UTC
    - cron: '50 19 * * 6,0'   # descanso de la franja de las 19:00 UTC

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # el script es de solo lectura: no commitea nada
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar el diagnóstico
        run: python scripts/diagnostico_api.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
