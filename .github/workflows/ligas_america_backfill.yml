name: Ligas America - backfill

# Escribe SOLO en modelos/ligas_america/data/. Se dispara al empujar un cambio
# en modelos/ligas_america/backfill.env (ligas, temporadas, pasos y tope).
on:
  workflow_dispatch:
  push:
    branches: [ccr-b5b31cbb-u7gf0v]
    paths: [modelos/ligas_america/backfill.env]

concurrency:
  group: ligas-america-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas
      - name: Backfill
        run: |
          set -a; . modelos/ligas_america/backfill.env; set +a
          python modelos/ligas_america/scripts/backfill.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add modelos/ligas_america/data || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Ligas America: backfill ($(date -u +%Y-%m-%dT%H:%M))"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
