name: Backfill titulares 2023/24 (box-score)

# /lineups no tiene nada antes de abril de 2024; /box-score sí marca los
# titulares (sondeo_titulares_boxscore.md: 16/16). Escribe en
# data/historico_lineups.csv con el mismo formato. ~1.734 llamadas. Reanudable.
on:
  workflow_dispatch:
    inputs:
      tope_llamadas:
        description: 'Maximo de llamadas a la API en esta pasada'
        required: false
        default: '2000'

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests pandas
      - name: Traer titulares
        run: python scripts/backfill_titulares_boxscore.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          TOPE_LLAMADAS: ${{ inputs.tope_llamadas || '2000' }}
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historico_lineups.csv || true
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "Lineups (titulares box-score 23/24): $(wc -l < data/historico_lineups.csv) filas ($(date -u +%Y-%m-%dT%H:%M))"
          git pull --rebase origin main
          git push
