name: Cosechar cuotas

# Las cuotas CADUCAN: la API las sirve 28 dias despues del partido y 7 antes.
# Lo que no se coseche en esa ventana se pierde para siempre. Por eso esto
# corre a diario, aunque hoy no sirva para nada.
on:
  schedule:
    - cron: '25 5 * * *'
  workflow_dispatch:
    inputs:
      tope_llamadas:
        description: 'Maximo de llamadas'
        required: false
        default: '1200'

jobs:
  cosechar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests
      - name: Cosechar
        run: python scripts/cosechar_cuotas.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          TOPE_LLAMADAS: ${{ inputs.tope_llamadas || '1200' }}
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cuotas_cosechadas.csv || true
          git diff --staged --quiet && { echo "sin cambios"; exit 0; }
          git commit -m "Cuotas cosechadas ($(date -u +%Y-%m-%dT%H:%M))"
          git pull --rebase origin main
          git push
