name: Backfill perfil de jugador

# Nacimiento, historial de valor de mercado y lesiones (/players/{id}) de los
# jugadores de las alineaciones. 1 llamada por jugador (~4.560). Reanudable.
on:
  workflow_dispatch:
    inputs:
      tope_llamadas:
        description: 'Maximo de llamadas a la API en esta pasada'
        required: false
        default: '5000'

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests pandas

      - name: Traer perfiles de jugador
        run: python scripts/backfill_perfil_jugador.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          TOPE_LLAMADAS: ${{ inputs.tope_llamadas || '5000' }}

      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jugador_perfil.csv data/jugador_valor_mercado.csv data/jugador_lesiones.csv data/sondeo_perfil_jugador || true
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "Perfil de jugador: $(( $(wc -l < data/jugador_perfil.csv) - 1 )) jugadores ($(date -u +%Y-%m-%dT%H:%M))"
          git pull --rebase origin main
          git push
