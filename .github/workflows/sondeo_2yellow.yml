name: Sondeo 2yellow (solo desde la rama de app_apostador)

# Sondeos de 2yellow con permiso del usuario. La primera línea de
# ejecutar.txt es el script que se lanza. Solo se dispara al empujar
# app_apostador/sondeos/ejecutar.txt en la rama ccr-302c299f-kdpgwl.
on:
  push:
    branches: [ccr-302c299f-kdpgwl]
    paths: [app_apostador/sondeos/ejecutar.txt]

jobs:
  sondeo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Sondear
        run: python "app_apostador/sondeos/$(head -1 app_apostador/sondeos/ejecutar.txt)" | tee app_apostador/sondeos/resultado.txt
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app_apostador/sondeos
          if git diff --staged --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Sondeo 2yellow: $(head -1 app_apostador/sondeos/ejecutar.txt)"
          git push
