name: Sondeo 2yellow (solo desde la rama de app_apostador)

# Sondeo de 3 partidos terminados en /matches/{id} con permiso del usuario
# (01/10/2026). Solo se dispara al empujar app_apostador/sondeos/ejecutar.txt
# en la rama ccr-302c299f-kdpgwl. El script no repite partidos ya guardados.
on:
  push:
    branches: [ccr-302c299f-kdpgwl]
    paths: [app_apostador/sondeos/ejecutar.txt]

jobs:
  sondeo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Sondear
        run: python app_apostador/sondeos/sondeo_matches_3.py | tee app_apostador/sondeos/resultado.txt
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app_apostador/sondeos
          if git diff --staged --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Sondeo 2yellow: 3 partidos terminados en /matches/{id}"
          git push
