name: Sondeo de fuentes alternativas (sin Highlightly)
on: workflow_dispatch
jobs:
  sondeo:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests
      - run: python scripts/sondeo_fuentes.py
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sondeo_fuentes.md || true
          git diff --cached --quiet && exit 0
          git commit -m "sondeo de fuentes alternativas"
          for i in 1 2 3; do git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main && break; sleep 5; done
