name: Tarjetas al descanso

# Compara el modelo del descanso contra las cuotas en vivo y registra cada
# observación para poder medir después si le ganamos al mercado.
#
# A diferencia de los diagnósticos, este SÍ escribe en el repositorio: deja
# el informe y va acumulando data/registro_descanso.csv.
on:
  workflow_dispatch:
    inputs:
      equipo:
        description: 'Filtrar por equipo (ej: sevilla). Vacío = ventana de minutos'
        required: false
        default: ''
      minuto_min:
        description: 'Minuto mínimo de la ventana'
        required: false
        default: '40'
      minuto_max:
        description: 'Minuto máximo de la ventana'
        required: false
        default: '55'
      forzar:
        description: 'Calcular aunque NO sea el descanso (solo prueba; no registra)'
        required: false
        default: 'no'
  schedule:
    # Un descanso dura quince minutos, así que mirar más despacio es perderlos.
    # Las horas salen del calendario real, no de suponer: de los 165 partidos
    # de los próximos 30 días, 148 son de fin de semana y los 17 restantes
    # caen en lunes y viernes. Martes, miércoles y jueves no tienen ninguno.
    #
    # Fin de semana: saques de 10:00 a 19:00 UTC -> descansos de 10:45 a 20:02.
    # (Antes empezaba a las 11:00 y se perdía el primer descanso del día.)
    - cron: '*/15 10-20 * * 6,0'
    # Lunes y viernes: saques de 16:00 a 19:00 -> descansos de 17:00 a 20:02.
    - cron: '*/15 17-20 * * 1,5'

jobs:
  descanso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Comparar modelo contra mercado en vivo
        run: python scripts/descanso_en_vivo.py
        working-directory: .
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          EQUIPO: ${{ inputs.equipo }}
          MINUTO_MIN: ${{ inputs.minuto_min || '40' }}
          MINUTO_MAX: ${{ inputs.minuto_max || '55' }}
          FORZAR: ${{ inputs.forzar }}
          PYTHONPATH: scripts

      - name: Guardar informe y registro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in descanso_en_vivo.md data/registro_descanso.csv; do
            [ -f "$f" ] && git add "$f" || echo "  [no existe] $f"
          done
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "Descanso en vivo ($(date -u +%Y-%m-%dT%H:%M))"
          git pull --rebase origin main
          git push
