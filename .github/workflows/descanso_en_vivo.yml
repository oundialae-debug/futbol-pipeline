name: Tarjetas al descanso

# Compara el modelo del descanso contra las cuotas en vivo y registra cada
# observación para poder medir después si le ganamos al mercado.
#
# A diferencia de los diagnósticos, este SÍ escribe en el repositorio: deja
# el informe y va acumulando data/registro_descanso.csv.
on:
  workflow_dispatch:
    inputs:
      equipo:
        description: 'Filtrar por equipo (ej: sevilla). Vacío = ventana de minutos'
        required: false
        default: ''
      minuto_min:
        description: 'Minuto mínimo de la ventana'
        required: false
        default: '40'
      minuto_max:
        description: 'Minuto máximo de la ventana'
        required: false
        default: '55'
      forzar:
        description: 'Calcular aunque NO sea el descanso (solo prueba; no registra)'
        required: false
        default: 'no'
  schedule:
    # Prioridad: acumular descansos cuanto antes. El coeficiente de las faltas
    # necesita del orden de 60 partidos y los minutos de Actions no se
    # facturan en un repositorio público, así que se mira ancho.
    #
    # Las horas no son un barrido a ciegas: el registro dice de dónde salen
    # las observaciones. La franja americana de madrugada (MLS y Serie A de
    # Brasil, que también cotizan tarjetas en vivo) dio 10 partidos, casi
    # tantos como la europea de tarde. Recortarla era tirar media cosecha.
    #
    # Europa y principio de América, todos los días. No solo fin de semana:
    # las seis ligas juegan poco entre semana, pero el comparador registra
    # cualquier liga con mercado, y esas sí juegan.
    - cron: '*/15 9-23 * * *'
    # América en prime time.
    - cron: '*/15 0-3 * * *'
    # Asia y Oceanía. Quedaba sin cubrir por prudencia con el límite de la
    # API, pero el consumo real es del 8% del tope, así que la prudencia
    # sobraba. De esta franja no ha salido todavía ninguna observación con
    # mercado -- que es justamente el motivo para mirar: no lo sabemos.
    - cron: '*/15 4-8 * * *'

jobs:
  descanso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Comparar modelo contra mercado en vivo
        run: python scripts/descanso_en_vivo.py
        working-directory: .
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          EQUIPO: ${{ inputs.equipo }}
          MINUTO_MIN: ${{ inputs.minuto_min || '40' }}
          MINUTO_MAX: ${{ inputs.minuto_max || '55' }}
          FORZAR: ${{ inputs.forzar }}
          PYTHONPATH: scripts

      - name: Guardar informe y registro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in descanso_en_vivo.md data/registro_descanso.csv data/consumo_api.json; do
            [ -f "$f" ] && git add "$f" || echo "  [no existe] $f"
          done
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "Descanso en vivo ($(date -u +%Y-%m-%dT%H:%M))"
          git pull --rebase origin main
          git push
