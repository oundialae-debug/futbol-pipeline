name: Revisión del descanso

# Dos cosas que van juntas: cerrar el registro (quién acertó, modelo o
# mercado) y sondear si podemos conseguir las faltas del primer tiempo.
on:
  workflow_dispatch:
    inputs:
      solo_sondeo:
        description: 'Solo el sondeo de faltas, sin cerrar el registro'
        required: false
        default: 'no'
  schedule:
    # El registro se llenaba solo pero nadie lo cerraba: las observaciones se
    # quedaban sin resultado hasta que alguien lanzaba esto a mano. Un dato
    # que nadie resuelve no mide nada.
    #
    # 23:10 UTC: ya han terminado los partidos europeos de la noche. Los
    # americanos de madrugada quedan para la pasada del día siguiente, que es
    # lo correcto -- el cierre solo puntúa partidos terminados.
    - cron: '10 23 * * *'

jobs:
  revision:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Cerrar el registro del descanso
        if: inputs.solo_sondeo != 'si'
        run: python scripts/cerrar_descanso.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          PYTHONPATH: scripts

      # Ya contestó lo suyo (no hay desglose por tiempos, pero los acumulados
      # de un partido en juego van al minuto). Solo a mano.
      - name: Sondear las faltas
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/sondeo_faltas.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          PYTHONPATH: scripts

      - name: Guardar el cierre
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in cierre_descanso.md data/registro_descanso.csv; do
            [ -f "$f" ] && git add "$f" || echo "  [no existe] $f"
          done
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "Cierre del descanso ($(date -u +%Y-%m-%dT%H:%M))"
          git pull --rebase origin main
          git push
