name: Partido suelto (liga fuera del proyecto)

on:
  workflow_dispatch:
    inputs:
      pais: {description: 'País (countryName de la API)', required: true, default: 'Argentina'}
      liga: {description: 'Nombre de la liga', required: true, default: 'Primera Nacional'}
      temporada: {description: 'Temporada', required: true, default: '2026'}
      local: {description: 'Texto del nombre del local (vacío = los que empiezan en 90 min)', required: false, default: ''}
      visitante: {description: 'Texto del nombre del visitante', required: false, default: ''}
      carpeta: {description: 'Carpeta en data/sueltos', required: true}

jobs:
  descargar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas
      - name: Descargar
        run: python modelos/sueltos/descargar_partido.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          PAIS: ${{ inputs.pais }}
          LIGA_NOMBRE: ${{ inputs.liga }}
          TEMPORADA: ${{ inputs.temporada }}
          LOCAL: ${{ inputs.local }}
          VISITANTE: ${{ inputs.visitante }}
          CARPETA: ${{ inputs.carpeta }}
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sueltos || true
          if git diff --staged --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Partido suelto: ${{ inputs.carpeta }} $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
