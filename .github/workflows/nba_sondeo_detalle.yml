name: NBA sondeo detalle

on:
  workflow_dispatch:
  push:
    branches: [ccr-806f37a0-trajzr]
    paths: [scripts/nba/sondeo_detalle.py]

jobs:
  sondeo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/nba/sondeo_detalle.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nba/sondeo || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "NBA sondeo detalle"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
