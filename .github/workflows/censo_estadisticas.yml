name: Censo de estadisticas y alineaciones

# Las 39 estadisticas por equipo que /statistics devolvia y nunca miramos, y
# la pregunta que decide: hay alineacion ANTES del pitido inicial?
on:
  workflow_dispatch:

jobs:
  censo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests
      - name: Censar
        run: python scripts/censo_estadisticas.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
