name: Sondeo ligas America (Brasil, Japon, Mexico)

# Solo lectura de la API (~200 llamadas) y de football-data.co.uk. Escribe
# unicamente modelos/ligas_america/sondeo_cobertura.md. Se dispara al empujar
# este script a la rama de trabajo, no a main.
on:
  workflow_dispatch:
  push:
    branches: [ccr-b5b31cbb-u7gf0v]
    paths: [modelos/ligas_america/scripts/sondeo_cobertura.py]

jobs:
  sondeo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas
      - name: Sondear
        run: python modelos/ligas_america/scripts/sondeo_cobertura.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
      - name: Guardar informe
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add modelos/ligas_america/sondeo_cobertura.md || true
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "Sondeo ligas America: $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
