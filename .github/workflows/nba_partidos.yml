name: NBA partidos (fase 1)

# Plan gratuito NBA: 100 llamadas/dia, cuota APARTE de la de futbol.
on:
  workflow_dispatch:
  push:
    branches: [ccr-806f37a0-trajzr]
    paths: [scripts/nba/descargar_partidos.py]

jobs:
  descargar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Descargar
        run: python scripts/nba/descargar_partidos.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nba || true
          if git diff --staged --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "NBA partidos: $(wc -l < data/nba/partidos.csv) filas"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
