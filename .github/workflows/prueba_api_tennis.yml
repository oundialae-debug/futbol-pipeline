name: Prueba API-Tennis

# Cuenta de API-Tennis del usuario (30/09/2026). Dos llamadas de prueba. Clave en el
# secreto del repo API_TENNIS_KEY; nunca se escribe en disco.
on:
  workflow_dispatch:

jobs:
  prueba:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas
      - name: Probar
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        run: |
          if [ -z "$API_TENNIS_KEY" ]; then echo "NO HAY SECRETO API_TENNIS_KEY"; mkdir -p data/tenis/api_tennis; echo "# Prueba de API-Tennis\n\nNo se encontró el secreto API_TENNIS_KEY." > data/tenis/api_tennis/prueba.md; else python -u modelos/tenis/scripts/prueba_api_tennis.py || true; fi
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tenis/api_tennis || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -q -m "Prueba API-Tennis ($(date -u +%Y-%m-%dT%H:%M))"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"
