name: Analizar ligas candidatas

# Rumania Liga II y Mexico Liga MX: ¿el precio esta mal o solo tiene menos
# ojos? Misma pregunta que mato la hipotesis de corners.
on:
  workflow_dispatch:

jobs:
  analizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests pandas numpy
      - name: Analizar
        run: python scripts/analizar_ligas_candidatas.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
      - name: Guardar detalle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/detalle_*.csv || true
          git diff --staged --quiet && { echo "sin cambios"; exit 0; }
          git commit -m "Detalle crudo de ligas candidatas ($(date -u +%Y-%m-%dT%H:%M))"
          git pull --rebase origin main
          git push
