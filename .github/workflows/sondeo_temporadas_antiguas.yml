name: Sondeo temporadas antiguas

on:
  workflow_dispatch:

jobs:
  sondeo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests
      - name: Sondear
        run: python scripts/sondeo_temporadas_antiguas.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
      - name: Guardar informe
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sondeo_temporadas_antiguas.md || true
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "Sondeo temporadas antiguas: $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin main
          git push
