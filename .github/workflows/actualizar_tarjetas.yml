name: Actualizar datos de La Liga

on:
  schedule:
    - cron: '0 6 * * *'   # todos los días a las 6:00 UTC (8:00 en España en invierno, 7:00 en verano)
  workflow_dispatch:        # también se puede lanzar a mano desde GitHub

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # necesario para poder guardar (commit) el CSV actualizado
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests pandas

      - name: Ejecutar la actualización
        run: python scripts/actualizar_datos.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}

      - name: Guardar los datos nuevos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f data/historico_tarjetas.csv ]; then
            echo "No se generó ningún archivo esta vez (posible límite de la API alcanzado) -- nada que guardar."
            exit 0
          fi
          git add data/historico_tarjetas.csv
          git diff --staged --quiet && echo "Sin cambios que guardar" && exit 0
          git commit -m "Actualización automática de datos ($(date +%Y-%m-%d))"
          git pull --rebase origin main
          git push
