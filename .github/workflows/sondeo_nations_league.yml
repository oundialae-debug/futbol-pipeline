name: Sondeo Nations League gol 1a parte

on:
  workflow_dispatch:
    inputs:
      dias_adelante:
        description: 'Dias hacia adelante a buscar partidos'
        required: false
        default: '10'
      max_partidos:
        description: 'Maximo de partidos a sondear con /odds'
        required: false
        default: '20'

jobs:
  sondeo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests pandas
      - name: Sondear
        run: python scripts/sondeo_nations_league.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          DIAS_ADELANTE: ${{ inputs.dias_adelante || '10' }}
          MAX_PARTIDOS: ${{ inputs.max_partidos || '20' }}
      - name: Guardar informe
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sondeo_nations_league.md || true
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "Sondeo Nations League: $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin main
          git push
