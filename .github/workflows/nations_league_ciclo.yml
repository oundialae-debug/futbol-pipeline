name: Nations League - ciclo (datos, pronósticos, aprendizaje)

# Tema aparte del proyecto de ambos marcan (modelos/selecciones/CLAUDE.md).
# Cada pasada: calendario y resultados de la Nations League, historial de las
# selecciones que falten (reanudable), previa de los partidos de las próximas
# 36 h (cuotas, árbitro, once), pronósticos con registro, y evaluación que
# reaprende el peso modelo/mercado. La de la mañana además refresca la forma
# de club de los jugadores y los amistosos de las selecciones (semanal, lunes).
on:
  schedule:
    - cron: '20 7 * * *'     # mañana: todo + forma de clubes
    - cron: '35 13 * * *'    # antes de los partidos de la tarde
    - cron: '10 15 * * *'    # antes de los de las 16:00 UTC (onces si la API ya los tiene)
    - cron: '50 17 * * *'    # antes de los de la noche (onces si la API ya los tiene)
    - cron: '0 12 27 9 *'    # arranque tras agotar la cuota el 26/09: 27/09 12:00 UTC
  workflow_dispatch:
    inputs:
      tope_llamadas:
        description: 'Máximo de llamadas a la API en esta pasada'
        required: false
        default: '400'
      forma_clubes:
        description: 'Refrescar la forma de club (1 = sí)'
        required: false
        default: '0'

concurrency:
  group: nations-league-ciclo
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # El 26/09 a las 20:00 UTC la cuota de la API estaba agotada: ninguna pasada
      # programada antes del 27/09 12:00 UTC (16 h después) hace nada.
      - name: Esperar a que vuelva la cuota
        id: espera
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%s)" -lt "$(date -u -d '2026-09-27 11:55' +%s)" ]; then
            echo "Antes del 27/09 12:00 UTC: la cuota de la API estaba agotada, no se hace nada."
            echo "saltar=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.espera.outputs.saltar != '1'
      - uses: actions/setup-python@v5
        if: steps.espera.outputs.saltar != '1'
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests pandas numpy scipy scikit-learn
        if: steps.espera.outputs.saltar != '1'
      - name: Forma de clubes (mañanas o a mano)
        if: steps.espera.outputs.saltar != '1' && (github.event.schedule == '20 7 * * *' || github.event.schedule == '0 12 27 9 *' || inputs.forma_clubes == '1')
        run: python modelos/selecciones/forma_clubes.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          TOPE_LLAMADAS: 200
          DIAS: 3
      - name: Datos de la Nations League
        if: steps.espera.outputs.saltar != '1'
        run: |
          # los lunes por la mañana se vuelven a pedir los partidos de 2026 de cada
          # selección (amistosos y otras competiciones que no están en el calendario)
          if [ "$(date -u +%u)" = "1" ] && [ "${{ github.event.schedule }}" = "20 7 * * *" ]; then
            export REFRESCAR_EQUIPOS=1
          fi
          python modelos/selecciones/nations_league.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          # arranque del 27/09: ~50 selecciones sin historial (~60 llamadas cada una)
          # y 10 partidos ese mismo día desde las 16:00 UTC; con 400 solo entraban
          # 5-6. 3.000 + 200 de forma de clubes caben en la cuota (7.500/día) con
          # el resto de crons en pausa.
          TOPE_LLAMADAS: ${{ inputs.tope_llamadas || (github.event.schedule == '0 12 27 9 *' && '3000') || '400' }}
      - name: Notas, pronósticos y evaluación (sin API)
        if: steps.espera.outputs.saltar != '1'
        run: |
          python modelos/selecciones/nota_jugadores_selecciones.py
          python modelos/selecciones/pronostico_selecciones.py
          python modelos/selecciones/evaluar_selecciones.py
      - name: Guardar
        if: always() && steps.espera.outputs.saltar != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/selecciones modelos/selecciones/*.md || true
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "Nations League ciclo: $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
