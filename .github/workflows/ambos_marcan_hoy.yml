name: Ambos marcan - partidos de hoy (datos)

on:
  workflow_dispatch:
    inputs:
      liga_id:
        description: 'Liga (120775 = Segunda)'
        required: false
        default: '120775'

jobs:
  descargar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests pandas
      - name: Descargar
        run: python scripts/ambos_marcan_hoy.py descargar
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          LIGA_ID: ${{ inputs.liga_id }}
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ambos_hoy || true
          if git diff --staged --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Ambos marcan hoy: $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
