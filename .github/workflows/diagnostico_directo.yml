name: Diagnóstico en directo

# Solo lectura. Busca cualquier partido EN JUEGO del mundo para contestar
# si la API sirve eventos parciales en directo y si las cuotas se mueven.
#
# Sin cron: lo que venía a comprobar ya está comprobado. Se lanza a mano
# cuando haga falta volver a mirar el directo.
on:
  workflow_dispatch:
    inputs:
      ligas:
        description: 'IDs de liga separados por coma donde buscar primero (opcional)'
        required: false
        default: ''
  # Sin cron: era un diagnóstico temporal y ya contestó lo suyo. Se
  # queda lanzable a mano, pero deja de gastar llamadas, que ahora
  # hacen falta para acumular descansos cada quince minutos.

jobs:
  directo:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # el script no commitea nada
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar el diagnóstico en directo
        run: python scripts/diagnostico_directo.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          LIGAS_EXTRA: ${{ inputs.ligas }}
