name: Descargar selecciones (Nations League)

on:
  workflow_dispatch:
    inputs:
      cruces:
        description: 'Partidos, local|visitante separados por ; (nombres exactos de la API). Ej: England|Spain;Czech Republic|Croatia'
        required: true
      fecha:
        description: 'Fecha YYYY-MM-DD de esos partidos (vacío = hoy en España)'
        required: false
        default: ''

jobs:
  cuotas:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests pandas
      - name: Descargar
        run: python modelos/selecciones/descargar_selecciones.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          TOPE_LLAMADAS: 700
          CRUCES: ${{ inputs.cruces }}
          FECHA: ${{ inputs.fecha }}
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/selecciones || true
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "Selecciones: $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
