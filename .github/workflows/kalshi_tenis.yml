name: Kalshi tenis (precios previos al partido)

# API pública de Kalshi, sin clave; aprobado por el usuario el 30/09/2026.
# Corre aquí para no gastar la sesión de Claude. Primero los mercados
# recientes (en lotes de 100), luego los antiguos serie a serie, guardando
# en la rama que lo lanza después de cada paso. Reanudable.
on:
  workflow_dispatch:
  push:
    branches: [ccr-3c3cfe57-etcioo]
    paths:
      - .github/workflows/kalshi_tenis.yml

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas
      - name: Descargar y guardar por partes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          guardar() {
            git add data/tenis/kalshi || true
            if git diff --staged --quiet; then return 0; fi
            git commit -q -m "Kalshi tenis: $1 ($(date -u +%Y-%m-%dT%H:%M))"
            for i in 1 2 3 4; do
              git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && return 0
              sleep $((2 ** i))
            done
          }
          SERIES="KXATPCHALLENGERMATCH KXWTACHALLENGERMATCH KXATPMATCH KXWTAMATCH KXATPGTOTAL KXATPGSPREAD KXWTAGTOTAL KXITFMATCH KXITFWMATCH"
          python -u modelos/tenis/scripts/kalshi_precios.py --recientes $SERIES
          guardar "recientes, todas las series"
          for s in $SERIES; do
            python -u modelos/tenis/scripts/kalshi_precios.py --antiguos $s
            guardar "antiguos $s"
          done
          echo "TERMINADO"
